name: Build

on:
  push:
    branches: [main]
    paths: ["wyoming_speaker_id/**", ".github/workflows/build.yaml"]
  pull_request:
    paths: ["wyoming_speaker_id/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Read add-on metadata
        id: meta
        run: |
          version=$(yq -r '.version' wyoming_speaker_id/config.yaml)
          base=$(yq -r ".build_from.${{ matrix.arch }}" wyoming_speaker_id/build.yaml)
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/${{ matrix.arch }}-addon-wyoming-speaker-id" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: wyoming_speaker_id
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test image
        run: |
          docker buildx build --load --platform ${{ matrix.platform }} \
            --build-arg BUILD_FROM=${{ steps.meta.outputs.base }} -t sid-test wyoming_speaker_id \
            --cache-from type=gha,scope=${{ matrix.arch }}
          docker run --rm --entrypoint /opt/venv/bin/python3 -w /usr/src/speaker_id sid-test -c \
            "from speaker_id import models; from speaker_id.embed import Embedder; import numpy as np; p,k=models.resolve('redimnet2_b2','/tmp'); print(Embedder(p,k)(np.zeros(32000,'float32')+0.01).shape)"
