configuration:
  upstream_uri:
    name: Upstream STT
    description: Wyoming speech-to-text service that does the transcription (e.g. tcp://core-whisper:10300).
  model:
    name: Speaker model
    description: Speaker embedding model. Changing it recomputes all voiceprints from the stored samples.
  threshold_high:
    name: Threshold "known"
    description: Minimum similarity to tag the transcript with a person's name.
  threshold_low:
    name: Threshold "guest"
    description: Below this similarity the speaker is a guest; between the two thresholds the result is "unknown".
  margin:
    name: Margin
    description: Required lead of the best person over the second best.
  min_speech_seconds:
    name: Minimum speech (s)
    description: Shorter commands are not identified and get the "unknown" label.
  tag_template:
    name: Tag template
    description: How the transcript is rewritten. Placeholders {name} and {text}.
  guest_label:
    name: Guest label
    description: Name used for unrecognized voices.
  unknown_label:
    name: Unknown label
    description: Name used when the result is uncertain or the command is too short.
  tag_unknown:
    name: Tag uncertain results
    description: If off, uncertain/short commands are passed through without a tag.
  cohort_norm:
    name: Compare with other voices
    description: Also compare the voice with clips of other people from the cohort, so household members are confused with strangers less often. Needs 20+ clips. Thresholds for this mode are switched automatically.
  publish_sensor:
    name: Publish sensor
    description: Update a Home Assistant sensor with the last speaker.
  sensor_entity:
    name: Sensor entity
    description: Entity id of the sensor.
  recent_buffer_size:
    name: Recent utterances
    description: How many recent utterances (with audio) are kept for the web UI; they survive restarts.
  log_level:
    name: Log level
    description: Logging verbosity.
network:
  10310/tcp: Wyoming STT (only needed for access from outside Home Assistant)
