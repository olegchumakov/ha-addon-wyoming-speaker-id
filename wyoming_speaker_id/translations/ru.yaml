configuration:
  upstream_uri:
    name: Адрес Whisper / STT (Wyoming)
    description: >-
      Куда передавать звук, чтобы превратить речь в текст. Обычно это дополнение Whisper:
      tcp://core-whisper:10300. Менять нужно, только если распознавание речи работает в другом месте.
      Проверить связь можно кнопкой в веб-интерфейсе дополнения.
  model:
    name: Модель узнавания голоса
    description: >-
      Чем дополнение узнаёт голоса. Оставьте redimnet2_b2 — она точнее всех. При смене модели
      записывать образцы заново не нужно: всё пересчитается само, но чувствительность лучше проверить.
  threshold_high:
    name: Узнавать по имени от
    description: >-
      Насколько голос должен быть похож на образцы человека, чтобы назвать его по имени (от 0 до 1).
      Больше — реже путает, но чаще отвечает «неизвестно»; меньше — наоборот. Обычно 0.40–0.55.
      Удобнее подбирать ползунком в веб-интерфейсе, глядя на «похожесть» в последних фразах.
  threshold_low:
    name: Гость, если похожесть ниже
    description: >-
      Если голос меньше похож на всех, кого дополнение знает, говорящий считается гостем.
      Между этим значением и «Узнавать по имени от» ответ — «неизвестно». Обычно 0.25–0.35.
  margin:
    name: Отрыв от следующего человека
    description: >-
      Насколько самый похожий человек должен опережать следующего, чтобы назвать его имя. Помогает не
      путать похожие голоса (например, родственников). Если путает членов семьи — увеличьте до 0.10–0.15.
      Обычно 0.08.
  min_speech_seconds:
    name: Минимум речи, секунд
    description: >-
      По слишком коротким фразам («да», «стоп») голос надёжно не узнать — они получают ответ «неизвестно».
      Обычно 0.6.
  tag_template:
    name: Как подписывать текст для ассистента
    description: >-
      В каком виде имя говорящего добавляется к распознанному тексту, который получает голосовой ассистент.
      {name} — кто говорит, {text} — что сказано. Например: [говорит: {name}] {text}
  guest_label:
    name: Слово для чужого голоса
    description: Что писать вместо имени, если голос чужой. Например, «гость».
  unknown_label:
    name: Слово, если не уверен
    description: >-
      Что писать вместо имени, если голос определить не удалось (короткая фраза или похожесть между двумя
      порогами). Например, «неизвестно».
  tag_unknown:
    name: Подписывать фразы, когда не уверен
    description: >-
      Включено — ассистент увидит «неизвестно», если голос не определён. Выключено — такие фразы
      передаются ассистенту без подписи.
  cohort_norm:
    name: Сравнивать с чужими голосами
    description: >-
      Если включено, голос сравнивается ещё и с записями посторонних людей из раздела «Чужие голоса»
      веб-интерфейса, чтобы реже путать своих с чужими. Нужно хотя бы 20–30 таких записей (работает от 10,
      до этого — обычный режим). Для этого режима у ползунков чувствительности свои значения, они
      переключаются автоматически (для «Узнавать по имени» обычно 2–3). Если сомневаетесь — не включайте.
  publish_sensor:
    name: Сенсор «кто говорил»
    description: >-
      Обновлять в Home Assistant сенсор с именем последнего говорящего — его можно использовать
      в автоматизациях и на панелях.
  sensor_entity:
    name: Название сенсора
    description: Идентификатор этого сенсора в Home Assistant. Обычно менять не нужно.
  recent_buffer_size:
    name: Сколько последних фраз хранить
    description: >-
      Сколько последних фраз (текст и запись голоса) хранить для веб-интерфейса, чтобы их можно было
      прослушать и назначить человеку. Сохраняются при перезапуске, более старые удаляются сами.
      0 — ничего не хранить.
  log_level:
    name: Подробность журнала
    description: Сколько подробностей писать в журнал дополнения. Обычно info; debug — для поиска проблем.
network:
  10310/tcp: Порт Wyoming STT (нужен, только если подключаетесь не из этого Home Assistant)
